<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Temperature Converter</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🌡 Temperature Converter</h1>
<p>Convert Given Temperature into Celsius, Fahrenheit & Newton</p>

<input type="number" id="kelvinInput" placeholder="Enter Temperature">

<div class="results">

<div class="card">
<h3>Celsius</h3>
<p id="celsius">--</p>
</div>

<div class="card">
<h3>Fahrenheit</h3>
<p id="fahrenheit">--</p>
</div>

<div class="card">
<h3>Newton</h3>
<p id="newton">--</p>
</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
